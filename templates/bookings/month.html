<div class="month-overview"><table class="month-grid"><caption class="visually-hidden">{{ day|date:'F Y' }}. Выберите день для просмотра расписания.</caption><thead><tr><th scope="col">Пн</th><th scope="col">Вт</th><th scope="col">Ср</th><th scope="col">Чт</th><th scope="col">Пт</th><th scope="col">Сб</th><th scope="col">Вс</th></tr></thead><tbody>{% for week in month_weeks %}<tr>{% for cell in week %}<td>{% if cell %}<a class="month-day{% if cell.selected %} selected-month-day{% endif %}{% if cell.today %} today-month-day{% endif %}" href="?view=month&amp;date={{ cell.date|date:'Y-m-d' }}" aria-label="{{ cell.date|date:'j E' }}, мероприятий: {{ cell.count }}{% if cell.conflict %}, есть пересечения{% endif %}{% if cell.selected %}, выбранный день{% endif %}" {% if cell.today %}aria-current="date"{% endif %}><span class="month-day-number">{{ cell.number }}</span><span class="month-day-summary">{% if cell.count %}<span class="month-event-count">{{ cell.count }}</span>{% endif %}{% if cell.conflict %}<span class="month-conflict" aria-hidden="true">!</span>{% endif %}</span></a>{% endif %}</td>{% endfor %}</tr>{% endfor %}</tbody></table></div>
