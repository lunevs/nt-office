{% if event.is_recurring or event.series_id %}<label class="scope-label" for="scope-{{ action }}">{% if action == 'confirm' %}Подтвердить{% elif action == 'resubmit' %}Отправить на подтверждение{% else %}Отменить{% endif %}</label><select name="scope" id="scope-{{ action }}"><option value="one">Только эта встреча</option><option value="future">Эта и все последующие встречи</option></select>{% endif %}
